services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexclair}
      POSTGRES_USER: ${POSTGRES_USER:-lexclair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexclair}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexclair}"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Passed through so provisioning YAMLs can substitute ${POSTGRES_*}
      # variables at Grafana boot (datasource config lives in
      # monitoring/grafana/provisioning/datasources/postgres.yml).
      POSTGRES_USER: ${POSTGRES_USER:-lexclair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexclair}
      POSTGRES_DB: ${POSTGRES_DB:-lexclair}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  grafana_data: