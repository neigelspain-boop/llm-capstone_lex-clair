# Provisioning config for the LexClair Postgres datasource.
# Grafana reads this at container boot and registers the datasource
# with zero UI clicks. Substitution uses env vars passed via
# docker-compose.yml → grafana service → environment.
#
# Note: `url: postgres:5432` uses the Docker service name, NOT localhost,
# because Grafana reaches Postgres over the Docker network.

apiVersion: 1

datasources:
  - name: LexClair
    type: postgres
    url: postgres:5432
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}