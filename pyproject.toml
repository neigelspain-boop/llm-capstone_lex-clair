[project]
name = "lex-clair"
version = "0.1.0"
description = "LLM Capstone Day 1 deliverable"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "tenacity",
    "pyyaml",
    "python-dotenv",
    "pandas",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "rag", "eval", "monitoring"]
