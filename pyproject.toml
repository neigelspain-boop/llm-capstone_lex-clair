[project]
name = "lex-clair"
version = "0.1.0"
description = "LLM Capstone Day 1 deliverable"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "tenacity",
    "pyyaml",
    "python-dotenv",
    "pandas",
    "tqdm",
    "chromadb>=1.5.9",
    "flagembedding>=1.4.0",
    "minsearch>=0.2.0",
    "openai>=2.46.0",
    "sentence-transformers>=5.6.0",
    "anthropic>=0.117.1",
    "mistralai>=2.7.1",
    "streamlit>=1.60.0",
    "psycopg2-binary>=2.9.12",
    "pdfplumber>=0.11.10",
    "pdf2image>=1.17.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "rag", "eval", "monitoring"]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that hit LLM APIs (~10-25s each, opt-in via -m slow)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
